.gitlab-to-nvftp:
  rules:
    - if: '$SYNC_DIRECTION == "gitlab-to-nvftp" || $SYNC_DIRECTION == "both"'

build-image:
  extends: .gitlab-to-nvftp
  stage: build
  image: docker:24.0.5-cli
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build -t "${IMAGE_TAG}" .
    - docker push "${IMAGE_TAG}"

export-image:
  extends: .gitlab-to-nvftp
  stage: export
  image: docker:24.0.5-cli
  services:
    - docker:24.0.5-dind
  needs:
    - job: build-image
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    TAR_NAME: flask-app-$CI_COMMIT_SHORT_SHA.tar.gz
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker pull "${IMAGE_TAG}"
    - docker save "${IMAGE_TAG}" | gzip > "${TAR_NAME}"
    - ls -lh "${TAR_NAME}"
  artifacts:
    paths:
      - "${TAR_NAME}"
    expire_in: 7 days

upload-to-nvftp:
  extends: .gitlab-to-nvftp
  stage: upload_to_nvftp
  image: alpine:3.20
  needs:
    - job: export-image
      artifacts: true
  variables:
    TAR_NAME: flask-app-$CI_COMMIT_SHORT_SHA.tar.gz
  before_script:
    - apk add --no-cache openssh-client
  script:
    - ./scripts/nvftp_upload.sh
