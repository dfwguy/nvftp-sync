.gitlab-to-nvftp:
  rules:
    - if: '$SYNC_DIRECTION == "gitlab-to-nvftp" || $SYNC_DIRECTION == "both"'

build-image:
  extends: .gitlab-to-nvftp
  stage: build
  image: docker:24.0.5-cli
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --file "${OUTBOUND_DOCKERFILE}" --tag "${OUTBOUND_IMAGE_TAG}" "${OUTBOUND_BUILD_CONTEXT}"
    - docker push "${OUTBOUND_IMAGE_TAG}"

export-image:
  extends: .gitlab-to-nvftp
  stage: export
  image: docker:24.0.5-cli
  services:
    - docker:24.0.5-dind
  needs:
    - job: build-image
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker pull "${OUTBOUND_IMAGE_TAG}"
    - docker tag "${OUTBOUND_IMAGE_TAG}" nvftp-export:latest
    - docker save nvftp-export:latest | gzip -n > "${OUTBOUND_ARCHIVE_NAME}"
    - ls -lh "${OUTBOUND_ARCHIVE_NAME}"
  artifacts:
    paths:
      - "${OUTBOUND_ARCHIVE_NAME}"
    expire_in: 7 days

upload-to-nvftp:
  extends: .gitlab-to-nvftp
  stage: upload_to_nvftp
  image: alpine:3.20
  needs:
    - job: export-image
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client
  script:
    - ./scripts/nvftp_upload.sh
