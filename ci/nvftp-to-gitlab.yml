.nvftp-to-gitlab:
  rules:
    - if: '$SYNC_DIRECTION == "nvftp-to-gitlab" || $SYNC_DIRECTION == "both"'

pull-from-nvftp:
  extends: .nvftp-to-gitlab
  stage: pull_from_nvftp
  image: alpine:3.20
  needs: []
  cache:
    key: "$CI_PROJECT_ID-nvftp-download-state"
    paths:
      - .nvftp-cache/
    policy: pull
  before_script:
    - apk add --no-cache openssh-client
  script:
    - ./scripts/nvftp_pull.sh
  artifacts:
    when: always
    reports:
      dotenv: reports/pull.env
    paths:
      - tmp/nvftp-source/
      - reports/
    expire_in: 7 days

diff-against-target-main:
  extends: .nvftp-to-gitlab
  stage: diff_against_target_main
  image: alpine:3.20
  needs:
    - job: pull-from-nvftp
      artifacts: true
  before_script:
    - apk add --no-cache git rsync
  script:
    - |
      if [ "$REMOTE_DOWNLOAD_SKIPPED" = "true" ]; then
        mkdir -p reports
        : >reports/changed_files.txt
        : >reports/diff_summary.txt
        : >reports/git_status.txt
        {
          printf '%s\n' 'HAS_CHANGES=false'
          printf '%s\n' 'FILES_ADDED=0'
          printf '%s\n' 'FILES_MODIFIED=0'
          printf '%s\n' 'FILES_DELETED=0'
          printf 'DOWNLOAD_STATE_FILE=%s\n' "$DOWNLOAD_STATE_FILE"
        } >reports/sync.env
        printf '%s\n' 'NVFTP manifest is unchanged; target comparison skipped.'
        exit 0
      fi
    - ./scripts/clone_target.sh
    - ./scripts/prepare_candidate.sh
    - ./scripts/detect_changes.sh
  artifacts:
    when: always
    reports:
      dotenv: reports/sync.env
    paths:
      - tmp/nvftp-source/
      - reports/
    expire_in: 7 days

validate-candidate:
  extends: .nvftp-to-gitlab
  stage: validate_candidate
  image: python:3.12-slim
  needs:
    - job: diff-against-target-main
      artifacts: true
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git make rsync
  script:
    - |
      if [ "$HAS_CHANGES" != "true" ]; then
        printf '%s\n' 'No NVFTP changes detected; validation skipped.' | tee reports/test.log
        exit 0
      fi
    - ./scripts/clone_target.sh tmp/target-repo "$TARGET_BASE_SHA"
    - ./scripts/prepare_candidate.sh
    - |
      set +e
      ./scripts/run_tests.sh >reports/test.log 2>&1
      test_status=$?
      set -e
      cat reports/test.log
      exit "$test_status"
  artifacts:
    when: always
    reports:
      dotenv: reports/sync.env
    paths:
      - tmp/nvftp-source/
      - reports/
    expire_in: 7 days

publish-sync-branch:
  extends: .nvftp-to-gitlab
  stage: publish_sync_branch
  image: alpine:3.20
  needs:
    - job: validate-candidate
      artifacts: true
  before_script:
    - apk add --no-cache git rsync
  script:
    - |
      if [ "$HAS_CHANGES" != "true" ]; then
        cp reports/sync.env reports/publish.env
        printf '%s\n' 'PUBLISHED_BRANCH=' >>reports/publish.env
        printf '%s\n' 'No NVFTP changes detected; branch publication skipped.'
        exit 0
      fi
    - ./scripts/clone_target.sh tmp/target-repo "$TARGET_BASE_SHA"
    - ./scripts/prepare_candidate.sh
    - ./scripts/detect_changes.sh
    - ./scripts/publish_sync_branch.sh
  artifacts:
    when: always
    reports:
      dotenv: reports/publish.env
    paths:
      - reports/
    expire_in: 7 days

create-or-update-mr:
  extends: .nvftp-to-gitlab
  stage: create_or_update_mr
  image: alpine:3.20
  cache:
    key: "$CI_PROJECT_ID-nvftp-download-state"
    paths:
      - .nvftp-cache/
    policy: pull-push
  needs:
    - job: publish-sync-branch
      artifacts: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ "$HAS_CHANGES" != "true" ]; then
        printf '%s\n' 'No NVFTP changes detected; merge request creation skipped.'
        ./scripts/checkpoint_download_manifest.sh
        exit 0
      fi
    - ./scripts/create_or_update_mr.sh
    - ./scripts/checkpoint_download_manifest.sh
  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 7 days
