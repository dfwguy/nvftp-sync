stages:
  - validate

default:
  image: python:3.14-slim
  before_script:
    - python -m pip install --disable-pip-version-check '.[dev]'

ruff:
  stage: validate
  script:
    - ruff check src tests

pytest:
  stage: validate
  script:
    - pytest -q

compile:
  stage: validate
  script:
    - python -m compileall -q src

