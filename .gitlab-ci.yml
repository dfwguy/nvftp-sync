default:
  tags:
    - type/docker
    - os/linux

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - when: never

stages:
  - build
  - export
  - upload_to_nvftp
  - pull_from_nvftp
  - diff_against_target_main
  - validate_candidate
  - publish_sync_branch
  - create_or_update_mr

variables:
  GIT_DEPTH: "1"
  OUTBOUND_BUILD_CONTEXT: "examples/gitlab-to-nvftp-container"
  OUTBOUND_DOCKERFILE: "examples/gitlab-to-nvftp-container/Dockerfile"
  OUTBOUND_IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  OUTBOUND_ARCHIVE_NAME: "container-image-$CI_COMMIT_SHORT_SHA.tar.gz"
  SYNC_DIRECTION:
    value: "gitlab-to-nvftp"
    options:
      - "gitlab-to-nvftp"
      - "nvftp-to-gitlab"
      - "both"
    description: "Select the synchronization workflow to run. Scheduled pipelines should set this explicitly."
  NVFTP_HOST: "transfer.nvftp.nvidia.com"

include:
  - local: /ci/gitlab-to-nvftp.yml
  - local: /ci/nvftp-to-gitlab.yml
