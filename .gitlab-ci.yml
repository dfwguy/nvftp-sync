default:
  tags:
    - type/docker
    - os/linux

# This project publishes reusable synchronization tooling. It never transfers
# target content itself. Target repositories include ci/target-sync.yml.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

stages:
  - test

test-sync-tooling:
  stage: test
  image: alpine:3.20
  before_script:
    - apk add --no-cache git openssh-client rsync
  script:
    - ./scripts/run_tests.sh
