display_information:
  name: nvis-ova-importer
  description: Human-gated NVFTP to NVIS-OVA GitLab importer
  background_color: "#76b900"
features:
  bot_user:
    display_name: nvis-ova-importer
    always_online: true
  slash_commands:
    - command: /nvis-import
      description: Plan a verified NVFTP import into NVIS-OVA GitLab
      usage_hint: nvftp=/allowed/path artifact=basename target=nvis-ova/project
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false

